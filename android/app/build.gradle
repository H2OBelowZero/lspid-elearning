plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing secrets live outside version control (see .gitignore); this file only
// exists on machines set up to actually sign a release build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.lspid.elearning'
    compileSdk 34

    defaultConfig {
        applicationId "com.lspid.elearning"
        // 21 covers the low-end devices this app targets; a plain WebView shell has no
        // native code, so there's nothing pulling the floor higher.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // full: every lesson, PDF and Word/PowerPoint document is packed inside the APK and served
    // locally, so nothing needs a connection. lite: the small online-only shell (APP_BASE_URL).
    flavorDimensions 'content'
    productFlavors {
        full {
            dimension 'content'
            applicationIdSuffix '.full'
            versionNameSuffix '-full'
            buildConfigField 'boolean', 'OFFLINE_BUNDLE', 'true'
            resValue 'string', 'app_name', 'mySDLR'
        }
        lite {
            dimension 'content'
            buildConfigField 'boolean', 'OFFLINE_BUNDLE', 'false'
            resValue 'string', 'app_name', 'E-Learning for LSPID'
        }
    }

    // The bundle is already-compressed media; storing it raw keeps installs fast and lets
    // the WebView stream assets without inflating them.
    androidResources {
        // The default pattern also drops every folder starting with '_' (all the _view/ document pages).
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress += ['pdf', 'docx', 'pptx', 'doc', 'png', 'jpg', 'jpeg', 'jfif', 'gif', 'html', 'css', 'js', 'svg', 'woff2']
    }

    sourceSets {
        full.assets.srcDir layout.buildDirectory.dir('siteAssets')
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // localhost + `adb reverse tcp:8843 tcp:8843` reaches the project's own
            // `node .devserver.js` (see ../../.claude/launch.json) from a real USB-connected
            // device. Testing on the emulator instead? Use 10.0.2.2, its alias for host localhost.
            buildConfigField "String", "APP_BASE_URL", "\"http://localhost:8843/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "APP_BASE_URL", "\"https://lspid-elearning.netlify.app/\""
            // Only signed on machines with keystore.properties (see .gitignore) — an unsigned
            // release build still works via `assembleRelease` for local inspection.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        // AGP 8.5.2's bundled lint analyzer hits the same JDK-25 JavaVersion.parse crash as the
        // Kotlin daemon (see gradle.properties) during its release-only "lint vital" pass. Skip
        // it here rather than on every release build until AGP ships a fix for this JDK.
        checkReleaseBuilds = false
    }
}

// Copies the website (repo root) into <assets>/site for the full flavor. Everything that isn't
// the site itself (Android project, installer, tooling, APKs) is left out.
def siteSync = tasks.register('syncSiteAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        exclude 'android/**', 'installer/**', 'downloads/**', '.git/**', '.agents/**', '.claude/**',
                '.serena/**', 'graphify-out/**', 'node_modules/**', '.netlify/**',
                '.devserver.js', 'skills-lock.json', '.netlifyignore', '.gitignore', '_headers',
                'README.md', '**/.DS_Store'
    }
    into layout.buildDirectory.dir('siteAssets/site')
}
tasks.configureEach { t ->
    if (t.name ==~ /merge.*Full.*Assets|lintVital.*Full.*|generate.*Full.*LintReportModel/) t.dependsOn siteSync
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
