plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing secrets live outside version control (see .gitignore); this file only
// exists on machines set up to actually sign a release build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.lspid.elearning'
    compileSdk 34

    defaultConfig {
        applicationId "com.lspid.elearning"
        // 21 covers the low-end devices this app targets; a plain WebView shell has no
        // native code, so there's nothing pulling the floor higher.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // localhost + `adb reverse tcp:8843 tcp:8843` reaches the project's own
            // `node .devserver.js` (see ../../.claude/launch.json) from a real USB-connected
            // device. Testing on the emulator instead? Use 10.0.2.2, its alias for host localhost.
            buildConfigField "String", "APP_BASE_URL", "\"http://localhost:8843/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "APP_BASE_URL", "\"https://lspid-elearning.netlify.app/\""
            // Only signed on machines with keystore.properties (see .gitignore) — an unsigned
            // release build still works via `assembleRelease` for local inspection.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        // AGP 8.5.2's bundled lint analyzer hits the same JDK-25 JavaVersion.parse crash as the
        // Kotlin daemon (see gradle.properties) during its release-only "lint vital" pass. Skip
        // it here rather than on every release build until AGP ships a fix for this JDK.
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
