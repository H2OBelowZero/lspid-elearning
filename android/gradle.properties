org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin 1.9.24's out-of-process compile daemon crashes on JDK 25 (JavaVersion.parse
# can't read "25.0.3"), which Android Studio's bundled JBR now is. Running in-process
# skips that daemon entirely instead of relying on Gradle's crash-and-fallback retry.
kotlin.compiler.execution.strategy=in-process
